<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control — AI Dashboard</title>
  <meta name="description" content="Real-time monitoring dashboard for OpenClaw AI agents">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/cards.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-icon">🚀</div>
        <span class="sidebar__brand-text">Mission Control</span>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="nav-item__icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-page="sessions">
          <span class="nav-item__icon">🧠</span>
          <span>Sessions</span>
          <span class="nav-item__badge" id="nav-sessions-count">0</span>
        </a>
        <a class="nav-item" data-page="cron">
          <span class="nav-item__icon">⏰</span>
          <span>Cron Jobs</span>
        </a>
        <a class="nav-item" data-page="memory">
          <span class="nav-item__icon">📝</span>
          <span>Memory</span>
        </a>
        <a class="nav-item" data-page="system">
          <span class="nav-item__icon">📡</span>
          <span>System</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar__left">
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle">System health & activity at a glance</p>
        </div>
        <div class="topbar__right">
          <div class="connection-status">
            <span class="connection-dot" id="conn-dot"></span>
            <span id="conn-text">Connecting...</span>
          </div>
        </div>
      </header>

      <!-- Pages -->
      <div class="page" id="page-dashboard"></div>
      <div class="page page--hidden" id="page-sessions"></div>
      <div class="page page--hidden" id="page-cron"></div>
      <div class="page page--hidden" id="page-memory"></div>
      <div class="page page--hidden" id="page-system"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
